<!-- _includes/home/section-video.html: Section 04 -->
<section class="home-video fade-up">
  <div class="container home-video-wrap">
    <header class="home-video-head">
      <h2 class="home-video-title">
        {% if page.lang == "en" %}Trails. Riders. Community.
        {% else %}トレイル。<wbr>ライダー。<wbr>コミュニティー。
        {% endif %}
      </h2>
    </header>
    <div class="home-video-player">
      <div class="home-video-aspect">
        <iframe
          src="https://player.vimeo.com/video/1195232610?byline=0&portrait=0&title=0&color=d4a843&dnt=1"
          frameborder="0"
          allow="autoplay; fullscreen; picture-in-picture"
          allowfullscreen
          loading="lazy"
          title="{% if page.lang == 'en' %}NAMBA 2026 reel{% else %}NAMBA 2026年リール{% endif %}"></iframe>
      </div>
    </div>
    <p class="home-video-caption">
      {% if page.lang == "en" %}1 minute. The 2026 season at NAMBA.
      {% else %}1分間。<wbr>NAMBAの<wbr>2026年<wbr>シーズン。
      {% endif %}
    </p>
  </div>
</section>
