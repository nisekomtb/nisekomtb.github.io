<!-- _includes/home/hero-parallax.html: Section 01 (video-background hero) -->
<div class="home-hero">
  <div class="home-hero-bg-wrap">
    <div class="home-hero-bg" style="background-image: url('/assets/images/home/hero-video-poster.jpg');"></div>
    <iframe
      class="home-hero-video"
      src="https://player.vimeo.com/video/1195232610?background=1&loop=1&autopause=0&dnt=1#t=0.7s"
      frameborder="0"
      allow="autoplay; fullscreen; picture-in-picture"
      allowfullscreen
      title="{% if page.lang == 'en' %}NAMBA 2026 reel{% else %}NAMBA 2026年リール{% endif %}"
      aria-hidden="true"
      tabindex="-1"></iframe>
    <div class="home-hero-overlay"></div>
  </div>
  <div class="home-hero-content">
    <h1 class="home-hero-title">
      {% if page.lang == "en" %}Niseko Area Mountain Bike Association
      {% else %}ニセコ<wbr>エリア<wbr>マウンテンバイク<wbr>協会
      {% endif %}
    </h1>
    <p class="home-hero-sub">
      {% if page.lang == "en" %}Building trails and community.
      {% else %}トレイルと<wbr>コミュニティーの<wbr>構築
      {% endif %}
    </p>
  </div>
  <button type="button" id="home-hero-cue" aria-label="{% if page.lang == 'en' %}Scroll to next section{% else %}次のセクションへスクロール{% endif %}"><span class="home-hero-cue-chevron"></span></button>
</div>
