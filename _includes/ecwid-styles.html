<!-- Shared Ecwid storefront overrides. Include on any page that embeds Ecwid. -->
<style>
  /* Hide product details internal navigation */
  .product-details__navigation {
    display: none !important;
  }

  /* Reset product browser min-height (Ecwid sets it too tall) */
  #ProductBrowser-1 {
    min-height: auto !important;
  }

  /* Cart "continue" row left-aligns */
  .ec-form__row--continue .form-control--done {
    text-align: left !important;
  }

  /* Primary buttons (add-to-cart, checkout, etc.) */
  .form-control button.form-control__button {
    color: #ffffff !important;
    background-color: var(--color-primary) !important;
    border-color: transparent !important;
    background: var(--color-primary) !important;
    border: 0 !important;
    border-radius: 4px !important;
    font-weight: 500 !important;
    padding-left: 24px !important;
    padding-right: 24px !important;
    font-size: 14px !important;
  }

  .form-control button.form-control__button:hover {
    background: var(--color-primary-hover) !important;
  }

  /* Payment method icons need a white background to be legible on dark theme */
  img.ecwid-PaymentMethodsBlockSvg {
    background: #fff !important;
  }

  /* Apple Pay button */
  .ec-cart__button--apple-pay {
    text-align: center !important;
    text-align: -moz-center !important;
    text-align: -webkit-center !important;
  }

  .ec-cart__button--apple-pay .form-control--button {
    border: 1px #fff solid !important;
    padding-left: 24px !important;
    padding-right: 24px !important;
    border-radius: 4px !important;
    width: 170px !important;
    margin: 0 auto !important;
    position: relative !important;
  }

  /* Hide Ecwid's storefront footer (My Account / Track Orders / Shopping Bag).
     Those links live in the site nav now. */
  .ec-footer {
    display: none !important;
  }

  /* Text inputs — match NAMBA contact form style */
  html#ecwid_html body#ecwid_body .ec-size .ec-store .form-control__text {
    background: var(--color-bg-panel) !important;
    border: 2px solid var(--color-bg-border) !important;
    border-radius: 4px !important;
    color: #ffffff !important;
    padding: 12px 16px !important;
    font-size: 16px !important;
    font-family: inherit !important;
    box-shadow: none !important;
  }

  /* Ecwid paints a 4-sided inset white shadow on the wrapper when focused. Suppress. */
  html#ecwid_html body#ecwid_body .ec-size .ec-store .form-control:has(> .form-control__text) {
    box-shadow: none !important;
  }

  html#ecwid_html body#ecwid_body .ec-size .ec-store .form-control__text:focus {
    outline: none !important;
    border-color: var(--color-accent) !important;
  }

  html#ecwid_html body#ecwid_body .ec-size .ec-store .form-control--error .form-control__text {
    border-color: rgb(229, 99, 99) !important;
  }

  html#ecwid_html body#ecwid_body .ec-size .ec-store .form-control__text::placeholder {
    color: #888888 !important;
    opacity: 1 !important;
  }

  /* When an Ecwid notice is showing, lift .t3-mainbody's stacking
   * context above the site header (z-index 1000) so the popup inside
   * it can paint above the nav. Uses :has() so this only kicks in
   * while a notice is visible — preventing the elevated stacking
   * order from hiding the nav's megamenu dropdowns at other times. */
  .t3-mainbody:has(.ec-notice) {
    z-index: 1500 !important;
  }
  /* Lift the popup itself above any content inside mainbody. */
  .ec-notices {
    z-index: 99999 !important;
  }

  /* Notice popup: green accent rail + Font Awesome info icon.
   * Background and radius live on .ec-notice__wrap, so the rail
   * and flat left edge need to go there too. */
  .ec-notice--info .ec-notice__wrap {
    border-left: 4px solid var(--color-secondary) !important;
    border-top-left-radius: 0 !important;
    border-bottom-left-radius: 0 !important;
  }
  .ec-notice--info .ec-notice__icon svg {
    display: none !important;
  }
  .ec-notice--info .ec-notice__icon::before {
    content: "\f05a";
    font-family: "Font Awesome 7 Free";
    font-weight: 900;
    font-size: 32px;
    line-height: 1;
    color: var(--color-secondary);
  }

  /* Size-chart tables inside product descriptions: mirror the
   * trails + event-itinerary treatment. The source HTML emits all
   * cells as <td>, so the first row is styled as the header via
   * :first-child. Ecwid storefront CSS uses high-specificity
   * !important rules from a CORS-locked stylesheet, so we match
   * its prefix (html#ecwid_html body#ecwid_body .ec-size .ec-store)
   * to win the cascade. */
  html#ecwid_html body#ecwid_body .ec-size .ec-store table.ecwid-description-table {
    width: auto !important;
    max-width: 100% !important;
    margin: 30px auto 10px !important;
    border: 1px solid rgba(255, 255, 255, 0.15) !important;
    border-radius: 3px !important;
    border-collapse: collapse !important;
    border-spacing: 0 !important;
    box-shadow: none !important;
  }

  html#ecwid_html body#ecwid_body .ec-size .ec-store table.ecwid-description-table td {
    background-color: var(--color-bg-panel) !important;
    color: #ffffff !important;
    text-align: center !important;
    padding: 10px 8px !important;
    font-weight: 700 !important;
    font-size: 14px !important;
    vertical-align: middle !important;
    border: 0 !important;
  }

  html#ecwid_html body#ecwid_body .ec-size .ec-store table.ecwid-description-table td:first-child {
    padding-left: 20px !important;
  }

  html#ecwid_html body#ecwid_body .ec-size .ec-store table.ecwid-description-table td:last-child {
    padding-right: 20px !important;
  }

  html#ecwid_html body#ecwid_body .ec-size .ec-store table.ecwid-description-table tr:first-child td {
    background: transparent !important;
    color: var(--color-accent) !important;
    font-family: "Metropolis", "Metropolis Fallback", Helvetica, Arial, sans-serif !important;
    font-size: 12px !important;
    text-transform: uppercase !important;
    letter-spacing: 0 !important;
    padding: 12px 8px !important;
    border-bottom: 1px solid var(--color-bg-border) !important;
  }
</style>
