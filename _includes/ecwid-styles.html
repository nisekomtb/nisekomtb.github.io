<!-- Shared Ecwid storefront overrides. Include on any page that embeds Ecwid. -->
<style>
  /* Hide product details internal navigation */
  .product-details__navigation {
    display: none !important;
  }

  /* Reset product browser min-height (Ecwid sets it too tall) */
  #ProductBrowser-1 {
    min-height: auto !important;
  }

  /* Cart "continue" row left-aligns */
  .ec-form__row--continue .form-control--done {
    text-align: left !important;
  }

  /* Primary buttons (add-to-cart, checkout, etc.) */
  .form-control button.form-control__button {
    color: #ffffff !important;
    background-color: var(--color-primary) !important;
    border-color: transparent !important;
    background: var(--color-primary) !important;
    border: 0 !important;
    border-radius: 4px !important;
    font-weight: 500 !important;
    padding-left: 24px !important;
    padding-right: 24px !important;
    font-size: 14px !important;
  }

  .form-control button.form-control__button:hover {
    background: var(--color-primary-hover) !important;
  }

  /* Payment method icons need a white background to be legible on dark theme */
  img.ecwid-PaymentMethodsBlockSvg {
    background: #fff !important;
  }

  /* Apple Pay button */
  .ec-cart__button--apple-pay {
    text-align: center !important;
    text-align: -moz-center !important;
    text-align: -webkit-center !important;
  }

  .ec-cart__button--apple-pay .form-control--button {
    border: 1px #fff solid !important;
    padding-left: 24px !important;
    padding-right: 24px !important;
    border-radius: 4px !important;
    width: 170px !important;
    margin: 0 auto !important;
    position: relative !important;
  }

  /* Hide Ecwid's storefront footer (My Account / Track Orders / Shopping Bag).
     Those links live in the site nav now. */
  .ec-footer {
    display: none !important;
  }

  /* Text inputs — match NAMBA contact form style */
  html#ecwid_html body#ecwid_body .ec-size .ec-store .form-control__text {
    background: var(--color-bg-panel) !important;
    border: 2px solid var(--color-bg-border) !important;
    border-radius: 4px !important;
    color: #ffffff !important;
    padding: 12px 16px !important;
    font-size: 16px !important;
    font-family: inherit !important;
    box-shadow: none !important;
  }

  /* Ecwid paints a 4-sided inset white shadow on the wrapper when focused. Suppress. */
  html#ecwid_html body#ecwid_body .ec-size .ec-store .form-control:has(> .form-control__text) {
    box-shadow: none !important;
  }

  html#ecwid_html body#ecwid_body .ec-size .ec-store .form-control__text:focus {
    outline: none !important;
    border-color: var(--color-accent) !important;
  }

  html#ecwid_html body#ecwid_body .ec-size .ec-store .form-control--error .form-control__text {
    border-color: rgb(229, 99, 99) !important;
  }

  html#ecwid_html body#ecwid_body .ec-size .ec-store .form-control__text::placeholder {
    color: #888888 !important;
    opacity: 1 !important;
  }
</style>
