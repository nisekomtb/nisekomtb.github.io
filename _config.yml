title: Niseko Area Mountain Bike Association
description: |
  The Niseko Area Mountain Bike Association (NAMBA) is a nonprofit organization based in Niseko,
  Japan. This volunteer-based, grassroots organization is focused on the building of trails and
  community and is working towards transforming Niseko into Asia's premier mountain bike
  destination. Learn more about us, our trails and the future of mountain biking in Japan at
  NAMBA.ngo
baseurl: ""
url: https://namba.ngo
github_username:  nisekomtb

# Disable the default github-pages theme (jekyll-theme-primer). The site has
# its own layouts and styles, so the theme is unused. Loading it triggers a
# Ruby 3.4 + jekyll-sass-converter 1.5.2 encoding bug on macOS shells without
# LANG=en_US.UTF-8 set.
theme: null

strict_front_matter: true
permalink: /:categories/:title-:year/

liquid:
  error_mode: strict

defaults:
  - scope:
      path: ""
    values:
      layout: default
      lang: en
  - scope:
      path: ja
    values:
      lang: ja
  - scope:
      path: projects/twin-peaks
    values:
      og:
        image: /assets/images/og/twinpeaks.jpg
  - scope:
      path: ja/projects/twin-peaks
    values:
      og:
        image: /assets/images/og/twinpeaks.jpg
  - scope:
      path: twin-peaks
    values:
      masthead:
        img: /assets/images/twinpeaks/header.jpg
        credit:
          url: https://www.liamlarnach.com
          name: Liam Larnach
      og:
        image: /assets/images/og/twinpeaks-2024.jpg
  - scope:
      path: ja/twin-peaks
    values:
      masthead:
        img: /assets/images/twinpeaks/header.jpg
        credit:
          url: https://www.liamlarnach.com
          name: Liam Larnach
      og:
        image: /assets/images/og/twinpeaks-2024.jpg
  - scope:
      path: where-to-ride
    values:
      masthead:
        img: /assets/images/bg/bg-header-twinpeaks.jpg
  - scope:
      path: ja/where-to-ride
    values:
      masthead:
        img: /assets/images/bg/bg-header-twinpeaks.jpg

exclude:
  - CLAUDE.md
  - .claude
  - chrome
  - node_modules
  - package.json
  - package-lock.json
  - .github
  - .superpowers

include:
  - .well-known

future: true
# incremental: true
