<style>
  #store {
    min-height: 1166px;
  }

  .ec-grid {
    display: block !important;
  }

  html#ecwid_html body#ecwid_body .ec-size .ec-store .details-gallery__images-spacer {
    margin-top: 35px;
  }

  .product-details__navigation {
    display: none !important;
  }

  #ProductBrowser-1 {
    min-height: auto !important;
  }

  html#ecwid_html body#ecwid_body .ec-size .ec-store .label--notice {
    background-color: var(--color-primary);
  }

  html#ecwid_html body#ecwid_body .ec-size .ec-store .label--notice::before {
    color: var(--color-primary);
  }

  html#ecwid_html body#ecwid_body .ec-size .ec-store .label--notice::after {

  }

  .ec-form__row--continue .form-control--done {

  }

  .form-control button.form-control__button {
    color: #ffffff !important;
    background-color: var(--color-primary) !important;
    border-color: transparent !important;
    background: var(--color-primary) !important;

    border: 0 !important;
    border-radius: 4px !important;
    font-weight: 500 !important;
    padding-left: 24px !important;
    padding-right: 24px !important;

    font-size: 14px !important;
  }

  .form-control button.form-control__button:hover {
    background: var(--color-primary-hover) !important;
  }

  img.ecwid-PaymentMethodsBlockSvg {
    background: #fff !important;
  }

  .ec-cart__button--apple-pay {
    text-align: center !important;
    text-align: -moz-center !important;
    text-align: -webkit-center !important;
  }

  .ec-cart__button--apple-pay .form-control--button {
    border: 1px #fff solid !important;
    padding-left: 24px !important;
    padding-right: 24px !important;
    border-radius: 4px !important;
    width: 170px !important;
    margin: 0 auto !important;
    position: relative !important;
  }

  a.breadcrumbs__link--last {
    font-size: 0 !important;
  }

  a.breadcrumbs__link--last:after {
    content: '✕';
    font-size: 20px;
    font-weight: bold;
    float: right;
  }

  html#ecwid_html body#ecwid_body #raffle-store .ec-size .ec-store .details-gallery__images-spacer {
    margin-top: 0;
  }

  #raffle-store a.breadcrumbs__link--last {
    display: none;
  }

  /* Size option buttons */
  html#ecwid_html body#ecwid_body .ec-size .ec-store .form-control--checkbox-button .form-control__inline-label label,
  html#ecwid_html body#ecwid_body .ec-size .ec-store .form-control--checkbox-button .form-control__checkbox:checked~.form-control__inline-label label:active,
  html#ecwid_html body#ecwid_body .ec-size .ec-store .form-control--checkbox-button .form-control__radio:checked~.form-control__inline-label label:active {
    background-color: var(--color-bg-panel) !important;
  }

  html#ecwid_html body#ecwid_body .ec-size .ec-store .form-control--checkbox-button .form-control__inline-label label:hover,
  html#ecwid_html body#ecwid_body .ec-size .ec-store .form-control--checkbox-button .form-control__radio:checked~.form-control__inline-label label {
    background-color: var(--color-bg-border) !important;
    border-color: var(--color-primary) !important;
  }

  /* Colour swatch hover/selected outline */
  html#ecwid_html body#ecwid_body .ec-size .ec-store .product-details-options__swatches .options-swatches-item__color:hover,
  html#ecwid_html body#ecwid_body .ec-size .ec-store .product-details-options__swatches .options-swatches-item__color:focus {
    outline-color: var(--color-primary) !important;
    border-color: var(--color-primary) !important;
  }

  html#ecwid_html body#ecwid_body .ec-size .ec-store .product-details-options__swatches .options-swatches-item__color--selected,
  html#ecwid_html body#ecwid_body .ec-size .ec-store .product-details-options__swatches .options-swatches-item__color--selected-disabled {
    outline-color: var(--color-primary) !important;
    border-color: var(--color-primary) !important;
  }

  html#ecwid_html body#ecwid_body .ec-size .ec-store .product-details-options__swatches .options-swatches-item__color:has(> .options-swatches-item__color--selected) {
    border-color: transparent !important;
