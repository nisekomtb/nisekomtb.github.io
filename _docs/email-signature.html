<!doctype html>
<!--
  NAMBA email signature — LIGHT (v1, business-card layout)  ·  Tom Mortiboy
  ------------------------------------------------------------------
  HOW TO INSTALL (Gmail):
    1. Deploy the site so the dark logo is live at:
       https://namba.ngo/assets/images/logos/email-logo.png
       (the headshot is already live). Until then it will 404.
    2. Open this file in a browser.
    3. Select the signature block below (everything inside the dashed frame),
       copy it (Cmd/Ctrl+C).
    4. Gmail → Settings (gear) → See all settings → General → Signature →
       create/edit, paste, Save Changes.

  NOTES:
    - All styling is inline + table-based: Gmail strips <style> blocks and
      data-URI images, so images are referenced by absolute https URLs.
    - Brand colours: rust #b34f24, golden sun #d4a843, charcoal #1a1a1a.
  ------------------------------------------------------------------
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NAMBA email signature — Tom Mortiboy</title>
  <style>
    /* Page chrome only — NOT part of the signature. Do not copy this. */
    body { background:#ececec; margin:0; padding:40px 20px; font-family:Arial,Helvetica,sans-serif; }
    .hint { max-width:640px; margin:0 auto 18px; color:#555; font-size:13px; line-height:1.5; }
    .frame { max-width:640px; margin:0 auto; padding:20px; border:1px dashed #bbb; border-radius:8px; }
  </style>
</head>
<body>
  <p class="hint"><strong>Select everything inside the dashed box below and copy it into Gmail → Settings → Signature.</strong></p>
  <div class="frame">

    <!-- ===== SIGNATURE START — copy from here ===== -->
    <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse; max-width:600px;">
      <tr>
        <td bgcolor="#ffffff" style="background:#ffffff; border:1px solid #e6e2dc; border-radius:10px; padding:22px 24px;">
          <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse; font-family:Arial,Helvetica,sans-serif; color:#1a1a1a;">
            <tr>
              <!-- Headshot -->
              <td valign="middle" style="padding:0 18px 0 0;">
                <img src="https://namba.ngo/assets/images/team/tom.jpg" alt="Tom Mortiboy" width="84" height="84" style="display:block; width:84px; height:84px; border-radius:50%; border:3px solid #d4a843; object-fit:cover;">
              </td>
              <!-- Name / title / links -->
              <td valign="middle" style="padding:0 16px 0 0; line-height:1.3;">
                <div style="font-size:18px; font-weight:bold; color:#b34f24; letter-spacing:0.2px;">Tom Mortiboy</div>
                <div style="font-size:13px; color:#1a1a1a; padding-top:2px;">モーティボーイ・トム</div>
                <div style="font-size:13px; color:#555555; padding-top:6px;">Co-founder</div>
                <div style="font-size:13px; color:#555555;">Head of Marketing &amp; Communications</div>
                <div style="font-size:13px; line-height:1.6; padding-top:12px;">
                  <a href="https://namba.ngo" style="color:#b34f24; text-decoration:none; font-weight:bold; white-space:nowrap;">namba.ngo</a>
                  <span style="color:#d4a843; padding:0 7px;">&middot;</span>
                  <a href="https://www.instagram.com/nisekomtb" style="color:#b34f24; text-decoration:none; white-space:nowrap;">Instagram</a>
                  <span style="color:#d4a843; padding:0 7px;">&middot;</span>
                  <a href="https://www.facebook.com/nisekoareamtbassociation" style="color:#b34f24; text-decoration:none; white-space:nowrap;">Facebook</a>
                </div>
              </td>
              <!-- Vertical divider -->
              <td valign="middle" style="padding:0 16px 0 0;">
                <table cellpadding="0" cellspacing="0" border="0" role="presentation"><tr><td style="width:2px; height:96px; background:#d4a843; font-size:0; line-height:0;">&nbsp;</td></tr></table>
              </td>
              <!-- Logo lockup (NAMBA + Niseko Area Mountain Bike Association + Supported by NISADE), on a white plate so it stays legible in email dark mode -->
              <td valign="middle">
                <a href="https://namba.ngo" style="text-decoration:none; border:0;">
                  <img src="https://namba.ngo/assets/images/logos/email-logo.png" alt="NAMBA, Niseko Area Mountain Bike Association, supported by NISADE" width="150" height="110" style="display:block; width:150px; height:110px; border:0;">
                </a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
    <!-- ===== SIGNATURE END — copy to here ===== -->

  </div>
</body>
</html>
