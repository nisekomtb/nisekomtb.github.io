<!doctype html>
<!--
  NAMBA email signature — DARK CARD (v2, business-card layout)  ·  Tom Mortiboy
  ------------------------------------------------------------------
  HOW TO INSTALL (Gmail):
    1. No deploy needed — both images are already live:
         https://namba.ngo/assets/images/team/tom.jpg
         https://namba.ngo/assets/images/logos/logo.png   (white lockup)
    2. Open this file in a browser.
    3. Select the signature block below (everything inside the dashed frame),
       copy it (Cmd/Ctrl+C).
    4. Gmail → Settings (gear) → See all settings → General → Signature →
       create/edit, paste, Save Changes.

  NOTES:
    - Dark "card" uses the site's warm panel #242220 with a bark-grey #2e2b28
      border. White NAMBA+NISADE lockup sits on the dark card as-is.
    - Brand colours: golden sun #d4a843, rust #b34f24, charcoal #242220.
    - bgcolor attributes are set alongside CSS so Outlook keeps the dark fill.
    - Caveat: a few email clients in forced dark-mode may re-tint a dark card;
      v1 (light) is the most universally safe. This version is the on-brand one.
  ------------------------------------------------------------------
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NAMBA email signature (dark) — Tom Mortiboy</title>
  <style>
    /* Page chrome only — NOT part of the signature. Do not copy this. */
    body { background:#ececec; margin:0; padding:40px 20px; font-family:Arial,Helvetica,sans-serif; }
    .hint { max-width:640px; margin:0 auto 18px; color:#555; font-size:13px; line-height:1.5; }
    .frame { max-width:640px; margin:0 auto; padding:20px; border:1px dashed #bbb; border-radius:8px; }
  </style>
</head>
<body>
  <p class="hint"><strong>Select everything inside the dashed box below and copy it into Gmail → Settings → Signature.</strong></p>
  <div class="frame">

    <!-- ===== SIGNATURE START — copy from here ===== -->
    <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;">
      <tr>
        <td bgcolor="#242220" style="background:#242220; border:1px solid #2e2b28; border-radius:10px; padding:22px 24px;">
          <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse; font-family:Arial,Helvetica,sans-serif; color:#cccccc;">
            <tr>
              <!-- Headshot -->
              <td valign="middle" style="padding:0 18px 0 0;">
                <img src="https://namba.ngo/assets/images/team/tom.jpg" alt="Tom Mortiboy" width="84" height="84" style="display:block; width:84px; height:84px; border-radius:50%; border:3px solid #d4a843; object-fit:cover;">
              </td>
              <!-- Name / title / links -->
              <td valign="middle" style="padding:0 22px 0 0; line-height:1.3;">
                <div style="font-size:18px; font-weight:bold; color:#d4a843; letter-spacing:0.2px;">Tom Mortiboy</div>
                <div style="font-size:13px; color:#ffffff; padding-top:2px;">モーティボーイ・トム</div>
                <div style="font-size:13px; color:#cccccc; padding-top:6px;">Co-founder</div>
                <div style="font-size:13px; color:#cccccc;">Head of Marketing &amp; Communications</div>
                <div style="font-size:13px; line-height:1; padding-top:12px;">
                  <a href="https://namba.ngo" style="color:#d4a843; text-decoration:none; font-weight:bold;">namba.ngo</a>
                  <span style="color:#b34f24; padding:0 7px;">&middot;</span>
                  <a href="https://www.instagram.com/nisekomtb" style="color:#d4a843; text-decoration:none;">Instagram</a>
                  <span style="color:#b34f24; padding:0 7px;">&middot;</span>
                  <a href="https://www.facebook.com/nisekoareamtbassociation" style="color:#d4a843; text-decoration:none;">Facebook</a>
                </div>
              </td>
              <!-- Vertical divider -->
              <td valign="middle" style="padding:0 22px 0 0;">
                <table cellpadding="0" cellspacing="0" border="0" role="presentation"><tr><td style="width:2px; height:96px; background:#b34f24; font-size:0; line-height:0;">&nbsp;</td></tr></table>
              </td>
              <!-- Logo lockup (white NAMBA + Niseko Area Mountain Bike Association + Supported by NISADE) -->
              <td valign="middle">
                <a href="https://namba.ngo" style="text-decoration:none; border:0;">
                  <img src="https://namba.ngo/assets/images/logos/logo.png" alt="NAMBA, Niseko Area Mountain Bike Association, supported by NISADE" width="150" height="104" style="display:block; width:150px; height:104px; border:0;">
                </a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
    <!-- ===== SIGNATURE END — copy to here ===== -->

  </div>
</body>
</html>
