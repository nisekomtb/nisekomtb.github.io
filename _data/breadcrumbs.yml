# Slug -> human-readable label for BreadcrumbList JSON-LD.
# Used by _includes/schema-breadcrumb.html. Resolution order:
#   1. This file (overrides + sub-pages not in nav)
#   2. _data/nav.yml (auto-pulls menu labels)
#   3. page.title (final segment fallback)
#   4. humanised slug (last resort)
#
# Add an entry here when:
#   - The menu label is too verbose for a breadcrumb (e.g. "About NAMBA"
#     in the menu vs. "About" in the breadcrumb).
#   - The slug isn't in nav.yml at all (sub-pages, legal pages, etc.).

