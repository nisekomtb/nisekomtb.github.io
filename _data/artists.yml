  title:
    en: Making Art & Stuff in Hokkaido
    ja: 北海道でアートやいろいろ作ってます
  titleHtml:
    ja: 北海道で<wbr>アートや<wbr>いろいろ<wbr>作ってます
  design:
    img: /assets/images/artists/peter-martin/design.jpg
    name:
      en: I Want to Ride my Bicycle
      ja: I Want to Ride my Bicycle
  bio:
    en: |
      <p>Peter Martin, aka The Rainbow Captain, is a Hokkaido-based artist originally from New York.</p>

      <p>After moving to Japan in the mid-1990s, Peter spent over a decade working in Tokyo’s fashion industry and as an art
      director and production designer, crafting sets, props, and visual environments for international commercials and short
      films.</p>

      <p>In recent years, he has traded city life for rural Hokkaido, dedicating himself to a more personal, exploratory art
      practice. His work reflects the nuanced perspective of a Westerner deeply immersed in Japanese culture, combining
      elements of vintage Japanese illustration, mid-century design, and Showa-era aesthetics to explore pattern, repetition,
      and cultural iconography.</p>

      <p>He also creates a line of handmade omiyage - wearable objects and collectible trinkets made in limited runs using analog
      techniques, blending humor, craftsmanship, and nostalgia. New projects and collaborations are always on the horizon.</p>
    ja: |
      <p>「The Rainbow Captain」と<wbr>して<wbr>活動する<wbr>ピーター・マーティンは、<wbr>ニューヨーク出身で<wbr>現在は<wbr>北海道を<wbr>拠点と<wbr>する<wbr>アーティストです。</p>

      <p>1990年代半ばに<wbr>来日後、<wbr>東京で<wbr>10年以上に<wbr>わたりファッション業界や<wbr>広告・映像制作の<wbr>アートディレクターと<wbr>して<wbr>活躍し、<wbr>数多くの<wbr>国際的な<wbr>CMや<wbr>短編映画の<wbr>美術セットや<wbr>プロップ制作を<wbr>手がけました。</p>

      <p>その後、<wbr>都市生活を<wbr>離れて北海道へ<wbr>移住し、<wbr>より<wbr>個人的で<wbr>探究的な<wbr>創作活動に<wbr>専念しています。<wbr>日本文化の<wbr>中に<wbr>深く<wbr>身を<wbr>置いた<wbr>経験から<wbr>生まれる<wbr>独自の<wbr>視点で、<wbr>昭和期の<wbr>デザインや<wbr>ヴィンテージイラスト、<wbr>ミッドセンチュリースタイルの<wbr>美学を<wbr>融合させ、<wbr>パターンや<wbr>アイコンを<wbr>通して<wbr>文化的アイデンティティを<wbr>探っています。</p>

      <p>また、<wbr>アナログ技法を<wbr>用いた<wbr>手作りの<wbr>おみや<wbr>げ<wbr>（Omiyage）<wbr>シリーズも<wbr>展開しており、<wbr>クラフトマンシップ、<wbr>ユーモア、<wbr>ノスタルジーを<wbr>融合させた<wbr>一点物の<wbr>アクセサリーや<wbr>トリンケットを<wbr>制作しています。<wbr>新しい<wbr>コラボレーションや<wbr>作品も<wbr>随時発表予定です。</p>

