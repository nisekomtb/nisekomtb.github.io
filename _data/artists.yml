    ja: 伝統的な<wbr>タトゥーアーティスト
  design:
    img: /assets/images/artists/scott-wentworth/design.jpg
    name:
      en: Shred and Enjoy
      ja: Shred and Enjoy
  bio:
    en: |
      <p>Scott Wentworth is a multidisciplinary artist whose creative path has spanned glassblowing, painting, illustration,
      digital design, and tattooing.</p>

      <p>Drawn to the bold imagery of American traditional tattooing, Scott completed a traditional apprenticeship in
      Jacksonville, Florida, between 2007 and 2008. Since then, tattooing has been his primary artistic focus.</p>

      <p>Originally from Colorado, Scott moved to Niseko in 2019 to start a family with his wife, who is from Kutchan. He now
      runs 59 Niseko, his tattoo studio located in the heart of downtown Kutchan, where he continues to refine his craft and
      contribute to the region’s creative community.</p>
    ja: |
      <p>スコット・ウェントワースは、<wbr>ガラス工芸、<wbr>絵画、<wbr>イラスト、<wbr>デジタルデザイン、<wbr>そして<wbr>タトゥーなど、<wbr>多様な<wbr>分野で<wbr>活動してきた<wbr>マルチアーティストです。</p>

      <p>2007〜2008年に<wbr>フロリダ州ジャクソンビルで<wbr>伝統的な<wbr>タトゥー修行を<wbr>受け、<wbr>アメリカントラディショナルスタイルの<wbr>タトゥーに<wbr>魅了されました。<wbr>以来、<wbr>タトゥーアートが<wbr>彼の<wbr>創作活動の<wbr>中心と<wbr>なっています。</p>

      <p>コロラド州出身の<wbr>スコットは、<wbr>2019年に<wbr>日本へ<wbr>移住し、<wbr>倶知安出身の<wbr>妻との<wbr>家族生活を<wbr>スタートしました。<wbr>現在は<wbr>倶知安町中心部に<wbr>自身の<wbr>スタジオ<wbr>「59 Niseko」を<wbr>構え、<wbr>タトゥーアーティストと<wbr>して<wbr>活動しながら、<wbr>地域の<wbr>アートコミュニティにも<wbr>貢献しています。</p>
