  name:
    en: Luke Sandalls
    ja: ルーク・サンダルズ
  title:
    en: Designer & Illustrator
    ja: デザイナー & イラストレーター
  design:
    img: /assets/images/artists/luke-sandalls/design.jpg
    name:
      en: Spirit of the Trail
      ja: Spirit of the Trail
  bio:
    en: |
      <p>Luke Sandalls is an Australian designer and artist who has called Niseko home since 2013. He now lives on the Iwanai
      mountainside with his wife, Tomomi, the creative behind Layer Niseko.</p>

      <p>Through his studio, Sandls Design, Luke works on branding, design, and business development, while his looser personal
      pieces are often shown under the name MtnSea, inspired by two of the region's greatest muses.</p>

      <p>His work is part sketchbook, part visual diary, drawing, painting, and writing as ways to explore flow, play, and
      meditation. Themes of identity, spirit, solitude, connection, and the balance between life and death thread through his
      eclectic practice, which continues to evolve as an exploration of being.</p>
    ja: |
      <p>ルーク・サンダルズは、<wbr>2013年から<wbr>ニセコを<wbr>拠点に<wbr>活動する<wbr>オーストラリア出身の<wbr>デザイナー兼アーティストです。<wbr>現在は、<wbr>Layer Niseko の<wbr>クリエイターである<wbr>妻トモミとともに、<wbr>岩内の<wbr>山麓で<wbr>暮らしています。</p>

      <p>自身の<wbr>スタジオ<wbr>「Sandls Design」では、<wbr>ブランディング、<wbr>デザイン、<wbr>ビジネス開発を<wbr>手がける<wbr>一方で、<wbr>より<wbr>自由な<wbr>個人作品は<wbr>「MtnSea」の<wbr>名の<wbr>もとに<wbr>発表しています。<wbr>この<wbr>名前は、<wbr>地域を<wbr>象徴する<wbr>二つの<wbr>大いなる<wbr>インスピレーション、<wbr>山と<wbr>海に<wbr>由来しています。</p>

      <p>彼の<wbr>作品は、<wbr>スケッチブックであり、<wbr>ビジュアルダイアリーでもあります。<wbr>ドローイング、<wbr>ペインティング、<wbr>そして<wbr>文章表現を<wbr>通じて、<wbr>「流れ」<wbr>「遊び」<wbr>「瞑想」を<wbr>探求しています。<wbr>アイデンティティ、<wbr>スピリット、<wbr>孤独と<wbr>つながり、<wbr>生と<wbr>死の<wbr>バランスと<wbr>いった<wbr>テーマが<wbr>彼の<wbr>多様な<wbr>作品群を<wbr>貫いており、<wbr>創作は<wbr>今もな<wbr>お「存在」を<wbr>探る<wbr>旅と<wbr>して<wbr>進化し続けています。</p>

