- slug: aikawa-mitsugu
  img: /assets/images/artists/aikawa-mitsugu/avatar.jpg
  header: /assets/images/artists/aikawa-mitsugu/header.jpg
  instagram: aikawamitsugu
  links:
    - scheme: https
      domain: aikawamitsugu.com
    - scheme: https
      domain: mitsuguart.official.ec
  work:
    - /assets/images/artists/aikawa-mitsugu/artwork-01.jpg
    - /assets/images/artists/aikawa-mitsugu/artwork-02.jpg
    - /assets/images/artists/aikawa-mitsugu/artwork-03.jpg
    - /assets/images/artists/aikawa-mitsugu/artwork-04.jpg
    - /assets/images/artists/aikawa-mitsugu/artwork-05.jpg
    - /assets/images/artists/aikawa-mitsugu/artwork-06.jpg
  name:
    en: Aikawa Mitsugu
    ja: 相川みつぐ
  title:
    en: Painter & Illustrator
    ja: 画家 & イラストレーター
  design:
    img: /assets/images/artists/aikawa-mitsugu/design.jpg
    name:
      en: Kumataka
      ja: クマタカ
  bio:
    en: |
      <p>Aikawa Mitsugu channels the primal energy of line and form, using shapes as building blocks to create allegorical
      worlds.

      <p>His works weave together striking geometric patterns, natural forms, and contrasting motifs, unfolding like visual
      stories. Through timeless imagery that connects past and future, he explores the deep relationship between humanity and
      nature.</p>

      <p>Balancing strong, structured backdrops with soft, flowing motifs, Aikawa creates a captivating harmony. His distinctive
      depictions of forests - through layered compositions, intricate detail, and nuanced color - draw viewers into worlds of
      depth and resonance.</p>

      <p>Born in 1976 and based in Sapporo, Aikawa graduated from the Hokkaido College of Art and Design and began his career in
      2008. He serves as visual director for the Tobiu Art Festival in Shiraoi Town and is active across a range of creative
      fields, including solo and group exhibitions, live painting at outdoor festivals, murals, commissions, and book
      illustrations.</p>
    ja: |
      <p>相川みつぐは、<wbr>線と<wbr>形の<wbr>持つ<wbr>原始的な<wbr>エネルギーを<wbr>引き出し、<wbr>形を<wbr>構成要素と<wbr>して<wbr>寓話的な<wbr>世界を<wbr>描き出すアーティストです。</p>

      <p>幾<wbr>何学的な<wbr>構成と<wbr>自然の<wbr>フォルム、<wbr>そして<wbr>対照的な<wbr>モチーフを<wbr>織り交ぜながら、<wbr>物語のように<wbr>展開する<wbr>作品を<wbr>生み出しています。<wbr>過去から<wbr>未来へと<wbr>続く<wbr>普遍的な<wbr>イメージを<wbr>通じて、<wbr>人間と<wbr>自然の<wbr>深い<wbr>関係を<wbr>探求しています。</p>

      <p>力強く<wbr>構築的な<wbr>背景と、<wbr>柔らかく<wbr>流れるような<wbr>モチーフとの<wbr>調和が、<wbr>独特の<wbr>美しさを<wbr>生み出しています。<wbr>森を<wbr>テーマに<wbr>した<wbr>作品は、<wbr>繊細な<wbr>筆致と<wbr>色彩、<wbr>そして<wbr>重なり合う<wbr>構図に<wbr>よって、<wbr>奥行きと<wbr>響きを<wbr>感じさせる<wbr>世界を<wbr>つくり出しています。</p>

      <p>1976年生まれ、<wbr>札幌市在住。<wbr>北海道造形デザイン専門学校を<wbr>卒業後、<wbr>2008年に<wbr>本格的に<wbr>活動を<wbr>開始。<wbr>白老町の<wbr>飛生芸術祭では<wbr>ビジュアルディレクターを<wbr>務め、<wbr>個展や<wbr>グループ展<wbr>（Silkio Project、<wbr>Geso Portraito、<wbr>Stopero Pinks、<wbr>春の<wbr>グループ展<wbr>「ハルウララ」など）に<wbr>加え、<wbr>野外音楽フェスでの<wbr>ライブペインティング、<wbr>店舗や<wbr>商業施設の<wbr>壁画制作、<wbr>受注作品、<wbr>書籍の<wbr>装画など<wbr>幅<wbr>広く<wbr>活動しています。</p>

- slug: frances-treveil
  img: /assets/images/artists/frances-treveil/avatar.png
  header: /assets/images/artists/frances-treveil/header.jpg
  instagram: frogletpaintings
  links:
    - scheme: http
      domain: frogletpaintings.com
  work:
    - /assets/images/artists/frances-treveil/artwork-01.jpg
    - /assets/images/artists/frances-treveil/artwork-02.jpg
    - /assets/images/artists/frances-treveil/artwork-03.jpg
    - /assets/images/artists/frances-treveil/artwork-04.jpg
    - /assets/images/artists/frances-treveil/artwork-05.jpg
    - /assets/images/artists/frances-treveil/artwork-06.jpg
    - /assets/images/artists/frances-treveil/artwork-07.jpg
  name:
    en: Frances Treveil
    ja: フランシス・トレヴィル
  title:
    en: Paintings & Clothing Repairs
    ja: 絵画 & 衣類のリペア
  titleHtml:
    ja: 絵画 & 衣類の<wbr>リペア
  design:
    img: /assets/images/artists/frances-treveil/design.jpg
    name:
      en: Annupuri
      ja: Annupuri
  bio:
    en: |
      <p>Frances Treveil is an artist, mountaineer, and snowboarder whose work is inspired by her journeys through mountains
      around the world. She seeks to capture the raw feeling of being in the mountains and translate that energy onto canvas.</p>

      <p>Originally from the UK and now living in the French Alps, Frances spent a year in Niseko exploring Japan’s deep powder,
      striking landscapes, and rich culture. Seeing the growth of alpine-style bike parks and the work NAMBA and others are
      doing to build a vibrant mountain biking community in Japan has made her optimistic about the sport’s future.</p>

      <p>Through her art, Frances aims to evoke the sense of wonder and awe she feels while climbing, snowboarding, or
      biking - allowing viewers to take a little piece of Japan’s mountain spirit home with them.</p>
    ja: |
      <p>フランシス・トレヴィルは、<wbr>世界中の<wbr>山々を<wbr>旅しながら<wbr>創作活動を<wbr>行う<wbr>アーティストであり、<wbr>登山家であり、<wbr>スノーボーダーでもあります。<wbr>彼女の<wbr>作品は、<wbr>山の<wbr>中で<wbr>感じる<wbr>エネルギーや<wbr>感動を<wbr>キャンバスの<wbr>上に<wbr>表現する<wbr>ことを<wbr>目指しています。</p>

      <p>イギリス出身で<wbr>現在は<wbr>フランス・アルプスに<wbr>在住。<wbr>以前は<wbr>ニセコに<wbr>1年間滞在し、<wbr>日本の<wbr>パウダースノーや<wbr>山々、<wbr>そして<wbr>食文化を<wbr>探求しました。<wbr>日本で<wbr>アルプススタイルの<wbr>バイクパークが<wbr>発展しつつある<wbr>こと、<wbr>そして<wbr>NAMBAを<wbr>はじめと<wbr>する<wbr>多くの<wbr>ライダーた<wbr>ちが<wbr>コミュニティを<wbr>築き、<wbr>発展に<wbr>尽力している<wbr>姿に<wbr>強く<wbr>感銘を<wbr>受けています。</p>

      <p>彼女の<wbr>作品には、<wbr>登山、<wbr>スノーボード、<wbr>マウンテンバイクと<wbr>いった<wbr>自然との<wbr>対話から<wbr>生まれる<wbr>「畏敬の<wbr>念」と<wbr>「感動」が<wbr>込められています。<wbr>作品を<wbr>通じて、<wbr>日本の<wbr>山々の<wbr>スピリットを<wbr>少しでも<wbr>感じて<wbr>もらえる<wbr>ことを<wbr>願っています。</p>

- slug: joe-scott
  img: /assets/images/artists/joe-scott/avatar.png
  header: /assets/images/artists/joe-scott/header.png
  instagram: joekkaido
  work:
    - /assets/images/artists/joe-scott/artwork-01.jpg
    - /assets/images/artists/joe-scott/artwork-02.jpg
    - /assets/images/artists/joe-scott/artwork-03.jpg
    - /assets/images/artists/joe-scott/artwork-04.jpg
    - /assets/images/artists/joe-scott/artwork-05.jpg
  name:
    en: Joe Scott
    ja: ジョー・スコット
  title:
    en: Designer & Illustrator
    ja: デザイナー & イラストレーター
  design:
    img: /assets/images/artists/joe-scott/design.jpg
    name:
      en: Twin Peaks badge
      ja: Twin Peaks badge
  bio:
    en: |
      <p>Joe Scott was born and raised in Birmingham, England, but found his artistic home in Sapporo.</p>

      <p>A passionate sketcher since childhood, Joe rediscovered his creative side in his twenties through vector art. Influenced
      by vintage travel posters and national park illustrations, his work explores the idea of art as a form of
      discovery - creating imagined worlds or celebrating those just beyond reach.</p>

      <p>After moving to Hokkaido straight out of university, Joe found endless inspiration in the landscapes outside his window.
      Now based permanently in Sapporo, he collaborates with local businesses on branding and design while creating National
      Park–style artwork celebrating Hokkaido’s mountains and landmarks.</p>

      <p>Joe's latest collaboration with NAMBA is the label for the <a href="/beer/">Twin Peaks Bike Park Pale Ale</a>, brewed by Yotei Brewing.</p>
    ja: |
      <p>ジョー・スコットは、<wbr>イギリス・バーミンガム出身の<wbr>アーティストで、<wbr>現在は<wbr>札幌を<wbr>拠点に<wbr>活動しています。</p>

      <p>幼少期から<wbr>絵を<wbr>描く<wbr>ことが<wbr>好きでしたが、<wbr>大学時代を<wbr>経て<wbr>20代の<wbr>頃に<wbr>ベクターアートと<wbr>出会い、<wbr>再び創作への<wbr>情熱を<wbr>取り戻しました。<wbr>トラベルポスターや<wbr>ナショナルパークの<wbr>イラストに<wbr>影響を<wbr>受け、<wbr>アートと<wbr>デザインを<wbr>通して<wbr>「世界を<wbr>探検する」<wbr>ことを<wbr>テーマに、<wbr>実在する<wbr>風景や<wbr>想像上の<wbr>世界を<wbr>描いています。</p>

      <p>大学卒業後に<wbr>移り<wbr>住んだ<wbr>北海道の<wbr>自然は、<wbr>彼の<wbr>作品の<wbr>最大の<wbr>インスピレーション源です。<wbr>現在は<wbr>札幌を<wbr>拠点に、<wbr>地域企業との<wbr>ブランディングや<wbr>デザインの<wbr>仕事を<wbr>行いながら、<wbr>北海道の<wbr>山々や<wbr>名所を<wbr>題材に<wbr>した<wbr>ナショナルパーク風の<wbr>作品シリーズを<wbr>制作しています。</p>

      <p>最新の<wbr>コラボレーションは、<wbr>ヨーテイブルーイングが<wbr>醸造する<wbr><a href="/ja/beer/">ツインピークスバイクパーク ペールエール</a>の<wbr>ラベルデザインです。</p>

