<script>
  // Pre-fill topic from URL param
  (function() {
    var params = new URLSearchParams(window.location.search);
    var topic = params.get('topic');
    if (topic) {
      var select = document.getElementById('interest');
      if (select) {
        for (var i = 0; i < select.options.length; i++) {
          if (select.options[i].value.toLowerCase().replace(/\s+/g, '-') === topic.toLowerCase() ||
              select.options[i].value.toLowerCase() === topic.toLowerCase()) {
            select.selectedIndex = i;
            break;
          }
        }
      }
    }
  })();
</script>
